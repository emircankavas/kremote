name: Release

# Tag-triggered release into the PUBLIC companion repository.
#
# The source repository is private, so an installed app cannot read its release
# API without a token. Everything the app reads lives in the public
# `emircan/kremote-releases` repository:
#
#   v1.8.0-beta.1  -> pre-release, appcast-beta.json
#   v1.8.0         -> stable release, appcast-stable.json (+ beta refreshed)
#
# No Apple Developer account: the bundle is ad-hoc signed (enough for arm64) and
# not notarized. Users clear quarantine once (right-click -> Open).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.8.0-beta.1)"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build & Release (macOS)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and channel
        id: version
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::unexpected tag '$TAG' (expected v*)"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          case "$VERSION" in
            *-*) CHANNEL="beta" ;;
            *)   CHANNEL="stable" ;;
          esac
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (channel=$CHANNEL)"

      - name: Install XcodeGen
        run: |
          set -o pipefail
          export PATH="$HOME/hermes-build/bin:$PATH"
          xcodegen --version || {
            mkdir -p "$HOME/hermes-build/bin"
            curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            rm -rf /tmp/xcodegen_dl && mkdir -p /tmp/xcodegen_dl && (cd /tmp/xcodegen_dl && unzip -q /tmp/xcodegen.zip)
            find /tmp/xcodegen_dl -maxdepth 4 -name xcodegen -type f -exec cp {} "$HOME/hermes-build/bin/xcodegen" \;
            chmod +x "$HOME/hermes-build/bin/xcodegen"
            xcodegen --version
          }

      - name: Cache FreeRDP build
        uses: actions/cache@v4
        with:
          path: |
            hermes-build/freerdp-install
            hermes-build/freerdp-build
          key: freerdp-${{ runner.os }}-${{ runner.arch }}-3.32.2-openh264

      - name: Build FreeRDP (permissive, OpenH264, no ffmpeg)
        run: |
          set -o pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          brew list --versions cmake ninja pkgconf openh264 jansson uriparser jpeg-turbo openssl@4 >/dev/null 2>&1 || \
            brew install cmake ninja pkgconf openh264 jansson uriparser jpeg-turbo openssl@4
          bash scripts/build-freerdp.sh "$HOME/hermes-build/freerdp-install"

      - name: Generate Xcode project
        run: |
          set -o pipefail
          export PATH="$HOME/hermes-build/bin:$PATH"
          xcodegen generate

      - name: Stamp the bundle version
        run: |
          set -o pipefail
          # project.yml carries the development version; the tag is authoritative
          # for a release, so the built bundle reports exactly what it is.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Info.plist
          echo "stamped Info.plist with ${{ steps.version.outputs.version }}"

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project KRemote.xcodeproj \
            -scheme KRemote \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify the bundle was produced
        run: |
          set -o pipefail
          APP="build/Build/Products/Release/KRemote.app"
          [ -d "$APP" ] || { echo "::error::no .app at $APP"; exit 1; }
          test -x "$APP/Contents/MacOS/KRemote" || { echo "::error::missing executable"; exit 1; }
          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          [ "$BUILT" = "${{ steps.version.outputs.version }}" ] || {
            echo "::error::bundle reports $BUILT, tag says ${{ steps.version.outputs.version }}"; exit 1; }
          echo "Bundle version: $BUILT"
          du -sh "$APP"

      - name: Embed the RDP libraries and sign
        env:
          KC_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          set -o pipefail
          APP="build/Build/Products/Release/KRemote.app"
          KEYCHAIN="$HOME/hermes-build/signing/kremote-signing.keychain-db"
          IDENTITY="-"
          if [ -n "${KC_PASSWORD:-}" ] && [ -f "$KEYCHAIN" ]; then
            security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
            IDENTITY="KRemote Dev"
          else
            echo "::warning::Stable signing identity unavailable; falling back to ad-hoc."
          fi
          bash scripts/embed-freerdp.sh "$APP" "$IDENTITY"
          codesign --verify --verbose=2 "$APP" || true

      - name: Package .dmg and .zip
        run: |
          set -o pipefail
          APP="build/Build/Products/Release/KRemote.app"
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf dmg-stage && mkdir dmg-stage
          cp -R "$APP" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "KRemote" -srcfolder dmg-stage -ov -format UDZO "KRemote-$VERSION.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "KRemote-$VERSION.zip"
          ls -lh "KRemote-$VERSION.dmg" "KRemote-$VERSION.zip"

      - name: Publish to the public releases repository
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -o pipefail
          VERSION="${{ steps.version.outputs.version }}"
          python3 scripts/publish-release.py \
            --tag "${{ steps.version.outputs.tag }}" \
            --version "$VERSION" \
            --channel "${{ steps.version.outputs.channel }}" \
            --notes RELEASE_NOTES.md \
            --dmg "KRemote-$VERSION.dmg" \
            --zip "KRemote-$VERSION.zip"

      - name: Verify the appcast the app will read
        run: |
          set -o pipefail
          CHANNEL="${{ steps.version.outputs.channel }}"
          URL="https://forgejo.kavas.dev/emircan/kremote-releases/raw/branch/main/appcast-$CHANNEL.json?t=$(date +%s)"
          echo "fetching $URL"
          curl -fsSL "$URL" -o appcast-check.json
          cat appcast-check.json
          python3 scripts/check-appcast.py appcast-check.json "${{ steps.version.outputs.version }}"
