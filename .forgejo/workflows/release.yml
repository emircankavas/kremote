name: Release

# Tag-triggered: pushing a v* tag builds a Release .app, signs it ad-hoc and
# attaches a .dmg to a GitHub Release.
#
# No Apple Developer account is required: the bundle is ad-hoc signed (enough for
# arm64 to run) and NOT notarized. Users clear Gatekeeper's quarantine once with
# `xattr -dr com.apple.quarantine /Applications/KRemote.app` (or right-click →
# Open). Notarization is a later step that needs a paid developer account.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (macOS)
    # Self-hosted: the Mac mini (no macOS-runner minutes on a private repo).
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: |
          set -o pipefail
          export PATH="$HOME/hermes-build/bin:$PATH"
          xcodegen --version || {
            mkdir -p "$HOME/hermes-build/bin"
            curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            rm -rf /tmp/xcodegen_dl && mkdir -p /tmp/xcodegen_dl && (cd /tmp/xcodegen_dl && unzip -q /tmp/xcodegen.zip)
            find /tmp/xcodegen_dl -maxdepth 4 -name xcodegen -type f -exec cp {} "$HOME/hermes-build/bin/xcodegen" \;
            chmod +x "$HOME/hermes-build/bin/xcodegen"
            xcodegen --version
          }

      - name: Cache FreeRDP build
        uses: actions/cache@v4
        with:
          path: |
            hermes-build/freerdp-install
            hermes-build/freerdp-build
          key: freerdp-${{ runner.os }}-${{ runner.arch }}-3.32.2-openh264

      - name: Build FreeRDP (permissive, OpenH264, no ffmpeg)
        run: |
          set -o pipefail
          # Homebrew provides the build deps (cmake/ninja/pkgconf + openssl,
          # openh264, jansson, uriparser, jpeg-turbo), NOT freerdp itself: its
          # bottle hard-depends on GPL-3.0 ffmpeg and pulls in X11/SDL/USB.
          export PATH="/opt/homebrew/bin:$PATH"
          brew list --versions cmake ninja pkgconf openh264 jansson uriparser jpeg-turbo openssl@4 >/dev/null 2>&1 || \
            brew install cmake ninja pkgconf openh264 jansson uriparser jpeg-turbo openssl@4
          # Built from source so nothing GPL-3.0 is embedded. ~10 MB of libraries.
          bash scripts/build-freerdp.sh "$HOME/hermes-build/freerdp-install"

      - name: Generate Xcode project
        run: |
          set -o pipefail
          export PATH="$HOME/hermes-build/bin:$PATH"
          xcodegen generate

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project KRemote.xcodeproj \
            -scheme KRemote \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify the bundle was produced
        run: |
          set -o pipefail
          APP="build/Build/Products/Release/KRemote.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Release build produced no .app at $APP"
            exit 1
          fi
          test -x "$APP/Contents/MacOS/KRemote" || { echo "::error::missing executable"; exit 1; }
          echo "Bundle size:"; du -sh "$APP"

      - name: Embed the RDP libraries and sign
        env:
          KC_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          set -o pipefail
          APP="build/Build/Products/Release/KRemote.app"
          KEYCHAIN="$HOME/hermes-build/signing/kremote-signing.keychain-db"
          IDENTITY="-"

          # A stable identity matters, not just "signed": an ad-hoc signature's
          # designated requirement is a cdhash that changes every build, which
          # invalidates the keychain ACL of every stored password and makes macOS
          # re-prompt after each update. Signing with a fixed certificate changes
          # the requirement to `certificate leaf = H"..."`, which survives updates.
          if [ -n "${KC_PASSWORD:-}" ] && [ -f "$KEYCHAIN" ]; then
            security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
            IDENTITY="KRemote Dev"
          else
            echo "::warning::Stable signing identity unavailable; falling back to ad-hoc."
            echo "::warning::Keychain passwords will be re-prompted after this update."
          fi

          # Copies the RDP libraries into Contents/Frameworks/, rewrites install
          # names, re-signs, and fails if anything outside the bundle is still
          # needed or if a GPL/X11 library slipped in.
          bash scripts/embed-freerdp.sh "$APP" "$IDENTITY"

          codesign --verify --verbose=2 "$APP" || true
          echo "Designated requirement:"
          codesign -d -r- "$APP" 2>&1 | sed -n '2,3p'

      - name: Package .dmg
        run: |
          set -o pipefail
          APP="build/Build/Products/Release/KRemote.app"
          NAME="KRemote-${{ steps.version.outputs.version }}.dmg"
          STAGE="dmg-stage"
          rm -rf "$STAGE"; mkdir "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "KRemote" -srcfolder "$STAGE" -ov -format UDZO "$NAME"
          echo "dmg=$NAME" >> "$GITHUB_OUTPUT"
        id: dmg

      - name: Package .zip (fallback)
        run: |
          set -o pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/KRemote.app \
            "KRemote-${{ steps.version.outputs.version }}.zip"

      - name: Write release notes
        run: |
          # The curated body lives in the repo; add the per-tag install footer to
          # it so both are on the release page.
          cat RELEASE_NOTES.md > /tmp/notes.md
          cat >> /tmp/notes.md <<'EOF'

          ### Install
          1. Download `KRemote-${{ steps.version.outputs.version }}.dmg` and open it.
          2. Drag **KRemote** to Applications.
          3. The app is **not notarized** (no Apple Developer account yet), so macOS
             quarantines it. Clear that once with either:
             - Terminal: `xattr -dr com.apple.quarantine /Applications/KRemote.app`
             - or right-click the app → **Open** → **Open** again.

          Then open it normally.
          EOF
          mv /tmp/notes.md RELEASE_NOTES.md

      - name: Publish release
        # softprops/action-gh-release is not published on data.forgejo.org, and
        # the gh CLI does not speak Forgejo's API. Use the release API directly.
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.version.outputs.tag }}'
          VERSION='${{ steps.version.outputs.version }}'
          API=https://forgejo.kavas.dev/api/v1/repos/emircan/kremote

          python3 -c 'import json,sys; print(json.dumps({"tag_name":sys.argv[1],"name":"KRemote "+sys.argv[1],"body":open("RELEASE_NOTES.md").read()}))' "$TAG" > release.json
          ID=$(curl -sS -X POST -H "Authorization: token $TOKEN" \
            -H 'Content-Type: application/json' --data @release.json "$API/releases" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "release id=$ID"

          for f in "KRemote-$VERSION.dmg" "KRemote-$VERSION.zip"; do
            [ -f "$f" ] || { echo "missing asset $f"; exit 1; }
            curl -sS -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" "$API/releases/$ID/assets?name=$f" >/dev/null
            echo "uploaded $f"
          done
