name: CI

on:
  push:
    # `beta` is the integration branch: new work lands there and must stay
    # green, so the shipped `main` build is never the first thing to see a
    # regression.
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    # Self-hosted: the Mac mini, so a private repo pays no macOS-runner minutes
    # (GitHub bills 10x for hosted macOS). See docs/SELF_HOSTED_RUNNER.md.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          set -o pipefail
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        # Self-hosted runner: XcodeGen is fetched once into ~/hermes-build/bin
        # by the runner bootstrap (no Homebrew on this Mac).
        run: |
          set -o pipefail
          export PATH="$HOME/hermes-build/bin:$PATH"
          xcodegen --version || {
            mkdir -p "$HOME/hermes-build/bin"
            curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            rm -rf /tmp/xcodegen_dl && mkdir -p /tmp/xcodegen_dl && (cd /tmp/xcodegen_dl && unzip -q /tmp/xcodegen.zip)
            find /tmp/xcodegen_dl -maxdepth 4 -name xcodegen -type f -exec cp {} "$HOME/hermes-build/bin/xcodegen" \;
            chmod +x "$HOME/hermes-build/bin/xcodegen"
            xcodegen --version
          }

      - name: Cache FreeRDP build
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.home }}/hermes-build/freerdp-install
            ${{ runner.home }}/hermes-build/freerdp-build
          key: freerdp-${{ runner.os }}-${{ runner.arch }}-3.32.2-openh264

      - name: Build FreeRDP (permissive, OpenH264, no ffmpeg)
        run: |
          set -o pipefail
          # Homebrew provides the build deps (cmake/ninja/pkgconf + openssl,
          # openh264, jansson, uriparser, jpeg-turbo), NOT freerdp itself: its
          # bottle hard-depends on GPL-3.0 ffmpeg and pulls in X11/SDL/USB.
          export PATH="/opt/homebrew/bin:$PATH"
          brew list --versions cmake ninja pkgconf openh264 jansson uriparser jpeg-turbo openssl@4 >/dev/null 2>&1 || \
            brew install cmake ninja pkgconf openh264 jansson uriparser jpeg-turbo openssl@4
          bash scripts/build-freerdp.sh "$HOME/hermes-build/freerdp-install"

      - name: Generate Xcode project
        run: |
          set -o pipefail
          export PATH="$HOME/hermes-build/bin:$PATH"
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          # arch=arm64 must be pinned: on this host a generic 'platform=macOS'
          # destination resolves to x86_64, while SwiftPM builds deps for arm64
          # only -> "Unable to resolve module dependency".
          xcodebuild \
            -project KRemote.xcodeproj \
            -scheme KRemote \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test (core package)
        run: |
          set -o pipefail
          cd Packages/KRemoteCore
          swift test

      - name: Package .app
        run: |
          set -o pipefail
          APP="build/Build/Products/Debug/KRemote.app"
          # Embed the RDP libraries so the artifact is runnable without Homebrew.
          bash scripts/embed-freerdp.sh "$APP" -
          ditto -c -k --sequesterRsrc --keepParent "$APP" KRemote-debug.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: KRemote-debug
          path: KRemote-debug.zip
          if-no-files-found: error
          retention-days: 14
