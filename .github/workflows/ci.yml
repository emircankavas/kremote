name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -o pipefail
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project KRemote.xcodeproj \
            -scheme KRemote \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .app
        run: |
          set -o pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug/KRemote.app \
            KRemote-debug.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRemote-debug
          path: KRemote-debug.zip
          if-no-files-found: error
          retention-days: 14
