name: KRemote

options:
  bundleIdPrefix: com.emircankavas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  swift-crypto:
    url: https://github.com/apple/swift-crypto
    # Must stay <4.0.0: Citadel pins swift-crypto to 3.12.3..<4.0.0.
    # Named "CryptoExtras" only from 4.x; in 3.x the product is "_CryptoExtras".
    exactVersion: 3.15.1
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    # 0.12.x requires swift-crypto >=3.12.3 (compatible with our 4.5.2 pin).
    exactVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.20.0 (tools 6.0); newer tags declare tools 6.2, unsupported by the CI Xcode.
    exactVersion: 1.20.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: "YES"
    # Ad-hoc signing for local dev. CI overrides with CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: "NO"
    # Reference the checked-in plist explicitly; never let XcodeGen auto-generate one.
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  KRemoteCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/KRemoteCore
    dependencies:
      - package: swift-crypto
        product: Crypto
      - package: swift-crypto
        product: _CryptoExtras
      - package: Citadel
        product: Citadel

  KRemote:
    type: application
    platform: macOS
    sources:
      - path: Sources/KRemote
    dependencies:
      - target: KRemoteCore
      - package: swift-crypto
        product: Crypto
      - package: swift-crypto
        product: _CryptoExtras
      - package: Citadel
        product: Citadel
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emircankavas.kremote
        PRODUCT_NAME: KRemote
        INFOPLIST_FILE: Info.plist

  KRemoteCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/KRemoteCoreTests
    dependencies:
      - target: KRemoteCore
      - package: swift-crypto
        product: Crypto
      - package: swift-crypto
        product: _CryptoExtras
      - package: Citadel
        product: Citadel

schemes:
  KRemote:
    build:
      targets:
        KRemote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KRemoteCoreTests
    archive:
      config: Release
