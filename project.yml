name: KRemote

options:
  bundleIdPrefix: com.emircankavas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # KRemoteCore is a real local SwiftPM package, not an XcodeGen `library.static`
  # target: Xcode fails to propagate C module maps into generated static-library
  # targets. It carries only swift-crypto (mRemoteNG confCons format); SSH runs
  # the system `ssh` on a PTY, so no SSH library is linked.
  KRemoteCore:
    path: Packages/KRemoteCore
  swift-crypto:
    url: https://github.com/apple/swift-crypto
    exactVersion: 3.15.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.20.0 (tools 6.0); newer tags declare tools 6.2, unsupported by the CI Xcode.
    exactVersion: 1.20.0

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: "YES"
    # Ad-hoc signing for local dev. CI overrides with CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: "NO"
    # Reference the checked-in plist explicitly; never let XcodeGen auto-generate one.
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  KRemote:
    type: application
    platform: macOS
    sources:
      - path: Sources/KRemote
    dependencies:
      - package: KRemoteCore
        product: KRemoteCore
      - package: swift-crypto
        product: Crypto
      - package: swift-crypto
        product: _CryptoExtras
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emircankavas.kremote
        PRODUCT_NAME: KRemote
        INFOPLIST_FILE: Info.plist

schemes:
  KRemote:
    build:
      targets:
        KRemote: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
