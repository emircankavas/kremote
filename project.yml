name: KRemote

options:
  bundleIdPrefix: com.emircankavas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # KRemoteCore is a real local SwiftPM package, not an XcodeGen `library.static`
  # target: Xcode fails to propagate C module maps into generated static-library
  # targets. It carries only swift-crypto (mRemoteNG confCons format); SSH runs
  # the system `ssh` on a PTY, so no SSH library is linked.
  KRemoteCore:
    path: Packages/KRemoteCore
  swift-crypto:
    url: https://github.com/apple/swift-crypto
    exactVersion: 3.15.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.20.0 (tools 6.0); newer tags declare tools 6.2, unsupported by the CI Xcode.
    exactVersion: 1.20.0

settings:
  base:
    MARKETING_VERSION: "1.6.4"
    CURRENT_PROJECT_VERSION: "15"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: "YES"
    # Ad-hoc signing for local dev. CI overrides with CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: "NO"
    # Reference the checked-in plist explicitly; never let XcodeGen auto-generate one.
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  KRemote:
    type: application
    platform: macOS
    sources:
      - path: Sources/KRemote
        excludes:
          - "Resources/*.icns"
      # The app icon is copied in as a plain resource (not an asset catalog, so
      # XcodeGen needs no extra target settings) and named by CFBundleIconFile.
      - path: Sources/KRemote/Resources/KRemote.icns
        buildPhase: resources
    dependencies:
      - package: KRemoteCore
        product: KRemoteCore
      - package: swift-crypto
        product: Crypto
      - package: swift-crypto
        product: _CryptoExtras
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emircankavas.kremote
        PRODUCT_NAME: KRemote
        INFOPLIST_FILE: Info.plist
        # The FreeRDP bridge is C, exposed through a bridging header. Installing
        # FreeRDP is a build-machine step (scripts/build-freerdp.sh or
        # `brew install freerdp`); the release bundle embeds the libraries so end
        # users need nothing. See README ▸ RDP sessions.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/KRemote/KRemote-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(FREERDP_ROOT)/include/freerdp3
          - $(FREERDP_ROOT)/include/winpr3
          - /opt/homebrew/include
        # Point at a permissively-licensed FreeRDP build (OpenH264, no ffmpeg):
        #   FREERDP_ROOT=$HOME/hermes-build/freerdp-install
        # Falls back to Homebrew's prefix so a plain `brew install freerdp` also
        # works for local development.
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(FREERDP_ROOT)/lib
          - /opt/homebrew/lib
        FREERDP_ROOT: $(HOME)/hermes-build/freerdp-install
        # Where to find the RDP dylibs at runtime. `@executable_path/../Frameworks`
        # is what the release bundle uses (the libraries are copied into the .app);
        # `$(FREERDP_ROOT)/lib` covers a plain local/debug run.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - $(FREERDP_ROOT)/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lfreerdp3
          - -lfreerdp-client3
          - -lwinpr3
          - -lopenh264

schemes:
  KRemote:
    build:
      targets:
        KRemote: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
