name: KRemote

options:
  bundleIdPrefix: com.emircankavas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # KRemoteCore is a real local SwiftPM package, not an XcodeGen `library.static`
  # target: Citadel -> NIOCore -> swift-atomics ships a C module (`_AtomicsShims`)
  # whose module map Xcode fails to propagate into a generated static-library
  # target ("missing required module '_AtomicsShims'"). SwiftPM resolves it.
  KRemoteCore:
    path: Packages/KRemoteCore
  swift-crypto:
    url: https://github.com/apple/swift-crypto
    # Must stay <4.0.0 (Citadel pins 3.12.3..<4.0.0); in 3.x the extras product
    # is named "_CryptoExtras", not "CryptoExtras".
    exactVersion: 3.15.1
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.20.0 (tools 6.0); newer tags declare tools 6.2, unsupported by the CI Xcode.
    exactVersion: 1.20.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: "YES"
    # Ad-hoc signing for local dev. CI overrides with CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: "NO"
    # Reference the checked-in plist explicitly; never let XcodeGen auto-generate one.
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  KRemote:
    type: application
    platform: macOS
    sources:
      - path: Sources/KRemote
    dependencies:
      - package: KRemoteCore
        product: KRemoteCore
      - package: swift-crypto
        product: Crypto
      - package: swift-crypto
        product: _CryptoExtras
      - package: Citadel
        product: Citadel
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emircankavas.kremote
        PRODUCT_NAME: KRemote
        INFOPLIST_FILE: Info.plist

schemes:
  KRemote:
    build:
      targets:
        KRemote: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
